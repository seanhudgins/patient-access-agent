[project]
name = "sierra-valley-patient-access-agent"
version = "0.1.0"
description = "Clara: AI patient access agent for Sierra Valley Health, a fictional regional health system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.91.0",
    "gradio>=6.11.0",
    "gspread>=6.2.1",
    "keyring>=25.7.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 130
target-version = "py314"
extend-exclude = ["ui/assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long prompt strings are easier to read on one line
